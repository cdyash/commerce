services:
  - type: web
    name: quickcart-merchant-api
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        generateValue: true
      - key: DEV_TOOLS
        value: "true"
      - key: AGENT_TOKENS
        value: default_agent:qc_agent_test_tok_123:catalog:read,cart:write,checkout:create,orders:read;readonly_agent:qc_ro_tok_456:catalog:read,orders:read
      - key: RAZORPAY_KEY_ID
        value: rzp_test_placeholder
      - key: RAZORPAY_KEY_SECRET
        value: placeholder_secret_key
      - key: RAZORPAY_WEBHOOK_SECRET
        value: placeholder_webhook_secret
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://quickcart-merchant-api.onrender.com
