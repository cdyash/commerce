services:
  - type: web
    name: quickcart-merchant-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        generateValue: true
      - key: DEV_TOOLS
        value: "false"
      - key: AGENT_TOKENS
        placeholder: "name:token:scopes;name:token:scopes"
      - key: RAZORPAY_KEY_ID
        placeholder: "rzp_test_placeholder"
      - key: RAZORPAY_KEY_SECRET
        placeholder: "razorpay_secret_placeholder"
      - key: RAZORPAY_WEBHOOK_SECRET
        placeholder: "webhook_secret_placeholder"
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        placeholder: "https://your-app-name.onrender.com"
